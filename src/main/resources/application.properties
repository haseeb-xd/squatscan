spring.application.name=squatscan

# Stdio transport (standard for locally-run MCP tools). Console logging must stay
# off so stdout carries only JSON-RPC messages.
spring.main.banner-mode=off
logging.pattern.console=
spring.main.web-application-type=none

spring.ai.mcp.server.name=squatscan
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Checks npm package names for signs of slopsquatting (hallucinated/typosquatted package names pre-registered by attackers). Call check_package, check_packages, or check_install_command before suggesting or running an npm install.
